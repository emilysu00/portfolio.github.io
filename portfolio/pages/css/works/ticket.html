            <h5 class="hero-kicker">Overview</h5>
            <p class="hero-text">
              延續主視覺風格，以黑金為主色系，營造低調奢華的質感。此外，針對不同期的講座主題設計了對應的專屬圖樣與視覺元素，確保每張票券不僅具有一致性的品牌識別，同時也能展現主題特色，使參與者能在視覺上直觀感受到當期講座的核心概念。同時，識別證的設計也在此視覺語言的延伸中，保持了黑金主色系與精緻的設計語彙。
            </p>
          </div>
